
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: pbl6-api
    ports:
      - "8000:8000"
    volumes:
      - ./src/models/tier1_svm/saved:/app/src/models/tier1_svm/saved:ro
      - ./src/models/tier2_bert/saved:/app/src/models/tier2_bert/saved:ro
      - ./src/preprocessing/vncorenlp:/app/src/preprocessing/vncorenlp
      - ./data:/app/data
    environment:
      # Qwen chạy qua Ollama trong Docker — port 11434
      - QWEN_API_URL=http://qwen:11434/v1/chat/completions
      - QWEN_MODEL_NAME=${QWEN_MODEL_NAME:-qwen3-4b-local}
      - QWEN_API_KEY=${QWEN_API_KEY:-not-needed}
    depends_on:
      - qwen
    restart: unless-stopped
    networks:
      - pbl6-net

  qwen:
    build:
      context: .
      dockerfile: docker/qwen.Dockerfile
    container_name: pbl6-qwen
    ports:
      - "11434:11434"
    volumes:
      - ./src/tier3_qwen/models/Qwen3-4B-GGUF:/models:ro
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL_NAME=${QWEN_MODEL_NAME:-qwen3-4b-local}
      # Kích hoạt GPU cho Ollama
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - pbl6-net

  image_service:
    build:
      context: .
      dockerfile: docker/image_service.Dockerfile
    container_name: pbl6-image-service
    ports:
      - "8001:8001"
    volumes:
      - ./image_service/saved:/app/image_service/saved:ro
    restart: unless-stopped
    networks:
      - pbl6-net

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: pbl6-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - pbl6-net

networks:
  pbl6-net:
    driver: bridge

volumes:
  ollama_data:    # Cache Ollama model metadata (không phải weights GGUF)
