
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: pbl6-api
    ports:
      - "8000:8000"
    volumes:
      - ./src/models/tier1_svm/saved:/app/src/models/tier1_svm/saved:ro
      - ./src/models/tier2_bert/saved:/app/src/models/tier2_bert/saved:ro
      - ./src/preprocessing/vncorenlp:/app/src/preprocessing/vncorenlp
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - QWEN_API_KEY=${QWEN_API_KEY:-not-needed}
      - QWEN_API_URL=${QWEN_API_URL:-http://qwen:8000/v1/chat/completions}
      - QWEN_MODEL_NAME=${QWEN_MODEL_NAME:-qwen3-4b-local}
    depends_on:
      - qwen
    restart: unless-stopped
    networks:
      - pbl6-net

  qwen:
    image: ghcr.io/abetlen/llama-cpp-python:latest
    container_name: pbl6-qwen
    ports:
      - "11434:8000"
    volumes:
      - ./src/tier3_qwen/weights:/models:ro
    entrypoint: ["python", "-m", "llama_cpp.server"]
    command:
      - --model
      - /models/Qwen3-4B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --n_ctx
      - "4096"
      - --n_threads
      - "8"
      - --n_gpu_layers
      - "0"
    restart: unless-stopped
    networks:
      - pbl6-net

  image_service:
    build:
      context: .
      dockerfile: docker/image_service.Dockerfile
    container_name: pbl6-image-service
    ports:
      - "8001:8001"
    volumes:
      - ./image_service/saved:/app/image_service/saved:ro
    restart: unless-stopped
    networks:
      - pbl6-net

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000
    container_name: pbl6-dashboard
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - pbl6-net

networks:
  pbl6-net:
    driver: bridge
