<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="tcd-popup">

      <!-- Header: logo + toggle -->
      <div class="tcd-header">
        <div class="tcd-brand">
          <div class="tcd-icon">🛡️</div>
          <div class="tcd-brand-text">
            <div class="tcd-title">Toxic Detector</div>
            <div class="tcd-host" id="tcd-host">Đang tải...</div>
          </div>
        </div>
        <label class="tcd-switch" title="Bật / tắt quét trang">
          <input type="checkbox" id="tcd-toggle" />
          <span class="tcd-slider"></span>
        </label>
      </div>

      <!-- API Status -->
      <div class="tcd-status-bar" id="tcd-status-bar">
        <span class="tcd-status-dot" id="tcd-status-dot"></span>
        <span class="tcd-status-text" id="tcd-status-text">Đang kiểm tra API...</span>
      </div>

      <!-- Stats: Offensive / Hate -->
      <div class="tcd-stats">
        <div class="tcd-stat-label">Đã chặn hôm nay</div>
        <div class="tcd-stat-row">
          <div class="tcd-stat-card tcd-stat-offensive">
            <span class="tcd-stat-dot"></span>
            <span class="tcd-stat-count" id="tcd-offensive-count">0</span>
            <span class="tcd-stat-name">Offensive</span>
          </div>
          <div class="tcd-stat-divider"></div>
          <div class="tcd-stat-card tcd-stat-hate">
            <span class="tcd-stat-dot"></span>
            <span class="tcd-stat-count" id="tcd-hate-count">0</span>
            <span class="tcd-stat-name">Hate</span>
          </div>
        </div>
      </div>

      <!-- Threshold slider -->
      <div class="tcd-threshold">
        <div class="tcd-threshold-header">
          <span class="tcd-threshold-label">Ngưỡng chặn</span>
          <span class="tcd-threshold-val" id="tcd-threshold-pct">80%</span>
        </div>
        <input
          type="range" id="tcd-threshold"
          min="0" max="1" step="0.05" value="0.8"
        />
        <div class="tcd-threshold-hints">
          <span>Nhạy nhất</span><span>Nghiêm nhất</span>
        </div>
      </div>

      <!-- Footer actions -->
      <div class="tcd-footer">
        <button id="tcd-reset" class="tcd-btn">🔄 Đặt lại</button>
      </div>

    </div>
    <script src="popup.js"></script>
  </body>
</html>
